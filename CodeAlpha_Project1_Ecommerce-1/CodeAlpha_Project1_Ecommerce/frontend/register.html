<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register | ShopSphere</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="navbar">
    <a class="brand" href="index.html">Shop<span>Sphere</span></a>
    <nav><a href="index.html">Shop</a><a href="cart.html">Cart <span id="cartCount">0</span></a></nav>
  </header>

  <main class="auth-wrap">
    <form id="registerForm" class="auth-card">
      <p class="eyebrow">JOIN SHOPSPHERE</p>
      <h1>Create account</h1>
      <label>Name<input name="name" required maxlength="80" autocomplete="name"></label>
      <label>Email<input name="email" type="email" required autocomplete="email"></label>
      <label>Password<input name="password" type="password" required minlength="6" autocomplete="new-password"></label>
      <button class="btn primary full" type="submit">Register</button>
      <p id="authMessage" class="message"></p>
      <p>Already registered? <a href="login.html">Login</a></p>
    </form>
  </main>
  <script src="app.js"></script>
</body>
</html>
